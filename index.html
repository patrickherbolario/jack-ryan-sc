<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Jack Ryan S&C"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Jack Ryan 12-Week S&C</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#0f0f0f;
  --border:#1e1e1e;--border2:#1a1a1a;--border3:#141414;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--text4:#475569;--text5:#334155;
  --acc-green:#4ade80;--acc-yellow:#facc15;--acc-orange:#f97316;--acc-gray:#94a3b8;
  --acc-blue:#185FA5;--acc-purple:#818cf8;--acc-red:#dc2626;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed','Arial Narrow',sans-serif;min-height:100%;overflow-x:hidden;}
.app{max-width:860px;margin:0 auto;padding-bottom:calc(60px + var(--safe-bot));}
/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(14px + var(--safe-top)) 16px 14px;}
.hdr h1{font-size:26px;font-weight:900;letter-spacing:0.08em;color:#fff;display:inline;}
.hdr-sub{font-size:12px;color:var(--text3);letter-spacing:0.12em;margin-left:8px;}
.hdr-desc{font-size:11px;color:var(--text4);margin-top:3px;font-family:'Barlow',sans-serif;}
/* BODY */
.body{padding:12px 12px;}
/* TABS */
.tabs{display:flex;gap:5px;margin-bottom:12px;}
.tab{flex:1;padding:10px 4px;font-size:13px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--text3);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;}
.tab.on{background:var(--acc-blue);color:#fff;border-color:var(--acc-blue);}
/* STAT GRID */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px;}
.sl{font-size:10px;color:var(--text4);font-weight:700;letter-spacing:0.1em;margin-bottom:2px;text-transform:uppercase;}
.sv{font-size:22px;font-weight:800;}
/* PHASE BANNER */
.pb{border-radius:5px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.pn{font-size:18px;font-weight:800;letter-spacing:0.05em;}
.pd{font-size:11px;color:var(--text2);font-family:'Barlow',sans-serif;flex:1;min-width:130px;}
.pw{border-radius:3px;padding:4px 10px;font-size:11px;font-weight:700;}
/* WEEK / DAY SELECT */
.wg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.wb{width:34px;height:34px;border-radius:3px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Barlow Condensed',sans-serif;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform 0.1s;}
.wb:active{transform:scale(0.92);}
.dg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px;}
.db{border-radius:5px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Barlow Condensed',sans-serif;min-width:44px;text-align:center;-webkit-tap-highlight-color:transparent;transition:transform 0.1s;}
.db:active{transform:scale(0.94);}
.db .ds{font-size:9px;opacity:0.7;margin-top:1px;}
/* SESSION CARD */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.ch{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.ct{font-size:19px;font-weight:900;color:#fff;letter-spacing:0.04em;}
.cn{font-size:11px;color:var(--text3);font-family:'Barlow',sans-serif;margin-top:2px;}
.ctg{margin-left:auto;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:0.1em;white-space:nowrap;}
.tb{display:inline-block;font-size:10px;font-weight:700;background:var(--border);color:var(--text2);border-radius:3px;padding:2px 6px;margin-top:3px;}
.c5b{display:inline-block;font-size:10px;font-weight:700;background:#f9730618;border:1px solid #f9730644;color:var(--acc-orange);border-radius:3px;padding:2px 6px;margin-top:3px;}
.pt{padding:7px 16px;background:var(--bg);border-bottom:1px solid var(--border2);font-size:10px;color:var(--text4);font-family:'Barlow',sans-serif;}
/* PROGRESS */
.pg{padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--border2);}
.pgb{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;}
.pgi{height:100%;border-radius:2px;transition:width 0.4s;}
.pgl{font-size:10px;color:var(--text5);margin-top:2px;font-family:'Barlow',sans-serif;}
/* SECTION LABEL */
.slbl{padding:7px 16px 3px;background:var(--bg);border-top:1px solid var(--border2);font-size:10px;color:var(--text4);letter-spacing:0.1em;font-weight:700;text-transform:uppercase;}
.dpb{display:inline-block;font-size:10px;background:#4ade8015;border:1px solid #4ade8030;color:var(--acc-green);border-radius:3px;padding:1px 6px;margin-top:2px;font-family:'Barlow',sans-serif;}
.divider{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:10px;color:var(--acc-orange);font-weight:700;letter-spacing:0.12em;text-align:center;padding:7px;}
/* EXERCISE ROW */
.er{padding:12px 16px;border-bottom:1px solid var(--border3);}
.er:last-child{border-bottom:none;}
.en{font-size:15px;font-weight:700;color:var(--text);letter-spacing:0.02em;}
.eno{font-size:10px;color:var(--text4);font-family:'Barlow',sans-serif;margin-left:4px;}
.esr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:5px 0 7px;}
.esi{font-size:12px;color:var(--text3);}
.esi strong{color:var(--text2);}
.ewb{border-radius:3px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;}
/* SET BOXES */
.sbs{display:flex;gap:5px;align-items:center;}
.sb{width:22px;height:22px;border-radius:3px;border:2px solid #333;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:all 0.15s;}
.sb svg{width:9px;height:9px;}
.sc2{font-size:10px;color:var(--text5);margin-left:2px;}
/* LOG INPUT */
.eta{width:100%;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text3);font-size:13px;padding:8px 10px;font-family:'Barlow',sans-serif;resize:vertical;line-height:1.5;min-height:64px;}
.eta:focus{outline:none;border-color:var(--text5);}
.day-notes-wrap{padding:14px 16px;background:var(--bg);border-top:1px solid var(--border2);}
.day-notes-lbl{font-size:10px;color:var(--text4);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;}
.day-notes-inp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:13px;padding:10px 12px;font-family:'Barlow',sans-serif;resize:vertical;line-height:1.6;min-height:90px;}
.day-notes-inp:focus{outline:none;border-color:var(--text5);}
/* MARK ROW */
.mr{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg);border-top:1px solid var(--border);}
.btn{cursor:pointer;border-radius:4px;padding:9px 14px;font-size:12px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.08em;border:none;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.bg{background:var(--acc-green);color:#000;}
.br{background:transparent;border:1px solid var(--acc-red);color:var(--acc-red);}
.b-export{background:transparent;border:1px solid var(--acc-blue);color:var(--acc-blue);}
.b-import{background:transparent;border:1px solid var(--text4);color:var(--text3);}
.as{font-size:10px;color:var(--text5);}
.export-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
/* WEEKLY STRUCTURE */
.wsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:14px;}
.wsc{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:8px 10px;}
.wsd{font-size:10px;color:var(--text4);font-weight:700;letter-spacing:0.08em;}
.wsl{font-size:12px;font-weight:700;margin-top:2px;}
.wss{font-size:10px;color:var(--text5);margin-top:1px;}
/* NOTES CARD */
.nc{margin-top:12px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--text4);font-family:'Barlow',sans-serif;line-height:1.7;}
.nt{font-weight:700;color:var(--text3);letter-spacing:0.08em;margin-bottom:5px;font-size:10px;text-transform:uppercase;}
.nc strong{color:var(--text2);}
/* SECTION CARD */
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:8px;}
.sct{font-size:13px;font-weight:800;color:var(--text);letter-spacing:0.05em;margin-bottom:10px;text-transform:uppercase;}
/* BW */
.bwr{display:flex;gap:7px;align-items:center;margin-bottom:10px;}
.inp{font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg3);color:var(--text);font-family:'Barlow',sans-serif;width:120px;}
.inp:focus{outline:none;border-color:var(--text5);}
.bwe{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border2);font-size:13px;}
.bwe:last-child{border-bottom:none;}
/* PR */
.prf{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px;}
.pri{font-size:13px;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg3);color:var(--text);font-family:'Barlow',sans-serif;width:100%;}
.pri:focus{outline:none;border-color:var(--text5);}
.prs{font-size:13px;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg3);color:var(--text);font-family:'Barlow Condensed',sans-serif;width:100%;}
.prs:focus{outline:none;border-color:var(--text5);}
.prln{font-size:10px;font-weight:700;color:var(--text4);letter-spacing:0.1em;text-transform:uppercase;margin:10px 0 4px;}
.pre{display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:9px 10px;margin-bottom:3px;}
.prw{font-size:16px;font-weight:800;color:var(--text);}
.prm{font-size:11px;color:var(--text4);text-align:right;font-family:'Barlow',sans-serif;}
.prb{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px;margin-left:4px;}
.db2{background:transparent;border:none;color:var(--acc-red);font-size:16px;cursor:pointer;padding:0 3px;}
/* RECENT */
.rec-item{padding:7px 0;border-bottom:1px solid var(--border2);}
.rec-item:last-child{border-bottom:none;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const PH=[
  {name:'ACCUMULATION',weeks:[1,2,3,4],color:'#4ade80',desc:'Build work capacity. Higher reps, moderate intensity.',in:'Leave 2 reps in tank. RPE 7–8.',sn:'Moderate load. Build consistency.'},
  {name:'INTENSIFICATION',weeks:[5,6,7,8],color:'#facc15',desc:'Load goes up, volume down. Strength focus.',in:'Push closer to failure. RPE 8–9.',sn:'Add 5–10% load. Reps drop.'},
  {name:'PEAK',weeks:[9,10,11],color:'#f97316',desc:'Max effort. Heavy compounds. Push limits.',in:'Top sets = PR attempts. RPE 9–10.',sn:'Reduce reps, max load.'},
  {name:'DELOAD',weeks:[12],color:'#94a3b8',desc:'Pull back. 50% volume. Let the gains settle.',in:'Move well, not heavy.',sn:'2–3 sets. 50% load. RPE 5–6.'},
];
const PRL=['Barbell bench press','Trap bar deadlift','Zercher squat','Belt squat','Barbell row','Romanian deadlift','DB incline press','DB shoulder press','Landmine press','Pull-ups (reps)','Farmer carry','KB swings'];
const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];

// ── ALL WEIGHTS — calibrated from 3 weeks of actual logged data (export 2026-06-01) ──
// Bench: actual working weight 115# wks 1-3. Wk4: 120#. Building from reality not estimates.
function bench(w){const a=[115,115,115,120,130,135,140,145,150,155,160,95];return{wt:a[w-1],r:w===12?'2×5':w<=4?'4×8':w<=8?'4×6':'4×4'};}

// Trap bar DL: 215# working wks 2-3, "felt good add 10#". Wk4: 225#.
function trapDL(w){const a=[215,215,215,225,245,255,265,275,285,295,305,185];return{wt:a[w-1],r:w===12?'2×5':w<=4?'4×8':w<=8?'4×6':'4×4'};}

// Zercher: wk1 95#, wk2-3 105#. Wk4: 110#.
function zercher(w){const a=[95,105,105,110,120,125,130,135,140,145,150,95];return{wt:a[w-1],r:w===12?'2×5':w<=4?'4×8':w<=8?'4×6':'4×4'};}

// Belt squat: wk2-3 145#. Wk4: 150#.
function beltSq(w){const a=[135,145,145,150,165,170,175,180,185,190,200,115];return{wt:a[w-1],r:w===12?'2×10':w<=4?'3×10':w<=8?'3×8':'3×6'};}

// RDL: wk2 95#, wk3 105#. Strong. Wk4: 110#.
function rdl(w){const a=[90,95,105,110,115,120,125,130,135,140,145,75];return{wt:a[w-1],r:w===12?'2×8':w<=4?'3×10':w<=8?'3×8':'3×6'};}

// Barbell row: wk2 75#, wk3 85#. Wk4: 90#.
function row(w){const a=[65,75,85,90,95,100,105,110,115,120,125,65];return{wt:a[w-1],r:w===12?'2×8':w<=4?'3×10':w<=8?'3×8':'3×6'};}

// DB incline: wk3 30# clean (no slingshot) for 12 reps. Wk4: 35#.
function diInc(w){const a=[30,30,30,35,40,40,45,45,50,50,55,25];return{wt:a[w-1],r:w===12?'2×10':w<=4?'3×10–12':w<=8?'3×8–10':'3×6–8'};}

// DB shoulder press: 20# wks 2-3, left trap tight wk3. Hold at 20# wk4.
function dbSh(w){const a=[20,20,20,20,25,25,30,30,35,35,40,20];return{wt:a[w-1],r:w===12?'2×10':w<=4?'3×10–12':w<=8?'3×8–10':'3×6–8'};}

// Landmine press: wk3 55# "possibly 60# next push week". Wk4: bar+15#=~60#.
function lmine(w){const a=[10,10,15,20,20,25,25,30,30,35,35,10];return{wt:a[w-1],r:w===12?'2×10':w<=4?'3×10–12':w<=8?'3×8–10':'3×6–8'};}
function lmineLabel(w){return`bar + ${lmine(w)}# plate (~${45+lmine(w)}# total)`;}

// Lateral raises: 15# consistent. Bump to 20# at intensification.
function lat(w){const a=[15,15,15,15,15,20,20,20,20,20,20,15];return{wt:a[w-1],r:w===12?'2×12':w<=4?'3×12':w<=8?'3×10':'3×8'};}

// DB clean & press — Saturday metcon
function dcp(w){const a=[30,30,30,35,35,40,40,45,45,50,50,25];return{wt:a[w-1],r:w===12?'2×10':w<=4?'3×12':w<=8?'3×10':'3×8'};}

// Hammer curls: consistent 25#. Wk4: 30#.
function hcurl(w){const a=[25,25,25,30,30,35,35,40,40,45,45,25];return{wt:a[w-1],r:w===12?'2×10':w<=4?'3×10–12':w<=8?'3×8–10':'3×6–8'};}

// Lat pulldown: wk2-3 both 80#. Wk4: 85#.
const latpd_arr=[75,80,80,85,90,95,100,105,110,115,120,70];
function latpdWt(w){return latpd_arr[w-1]||75;}

// Face pulls: wk3 20# "could have gone heavier". Wk4: 25#.
const facepull_arr=[15,15,20,25,25,30,30,35,35,35,40,20];
function facepullWt(w){return facepull_arr[w-1]||15;}

// Hip thrusts: new Saturday BJJ accessory. Conservative start.
function hipThrustWt(w){const a=[95,95,95,115,135,145,155,165,175,185,195,95];return a[w-1]||95;}

// Nordic curl negatives — eccentric only, build to full over time
function nordicReps(w){return w<=4?'3×4 negatives (slow 5s lower)':w<=8?'3×5 negatives':'3×6 negatives';}

// Landmine rotations: wk3 logged bar+15#=60#.
const lmrot_arr=[55,55,60,65,65,70,70,75,75,80,80,55];
function lmrotWt(w){return lmrot_arr[w-1]||55;}

// Pull-ups: wk3 shows "1st set 4 bands, sets 2-4 3 bands". Progress to 3 bands all wk4.
function band(w){return w<=3?'4 bands':w<=4?'3 bands':w<=7?'2–3 bands':w<=9?'2 bands':w<=11?'1 band':' 2 bands (deload)';}

// GHD sit-ups: core still sore wk2. Keep 3×8 all accumulation.
function ghdReps(w){return w<=4?'8':w<=8?'10':'12';}

function sled(w){return w===12?'90#':w<=4?'135#':w<=8?'155#':'185#';}
function fc(w){return w===12?'95#':w<=4?'145#':w<=8?'165#':'185#';}
function kb(w){return w<=6?'44–53#':w<=10?'53#':'53–70#';}
function cx(w){return w===12?65:95;}
function rs(w){return w===12?'60s':w<=4?'90s':w<=8?'2 min':'3 min';}
function ns(s){const m=(s||'').match(/^(\d+)/);return m?parseInt(m[1]):0;}
function nr(s){return(s||'').includes('×')?(s||'').split('×')[1]:(s||'');}
function gp(w){return PH.find(p=>p.weeks.includes(w))||PH[0];}

function prog(w){
  const r=rs(w),lr=w===12?3:w<=4?4:w<=8?5:6;
  const B=bench(w),TD=trapDL(w),Z=zercher(w),BS=beltSq(w),RDL=rdl(w),ROW=row(w);
  const DI=diInc(w),DS=dbSh(w),LM=lmine(w),LAT=lat(w),DCP=dcp(w);
  return[
    {day:'MON',label:'PUSH',tag:'Lift',tc:'#4ade80',focus:'Chest / Shoulders / Triceps',note:`Rest: ${r} bench · 60s accessories`,time:'~55 min',c5:1,secs:[
      {l:'Warm-up · 8 min',ex:[{n:'Jump rope',s:0,r:'3 min'},{n:'Band pull-aparts',s:0,r:'2×15'},{n:'Shoulder CARs',s:0,r:'3–5 reps each arm · slow'}]},
      {l:'Primary — bench press',ex:[{n:'Barbell bench press',s:ns(B.r),r:nr(B.r),w:`${B.wt}#`,no:'Control descent · C5 aware · no forced reps left'}]},
      {l:'Secondary — double progression · 75s rest',dp:1,ex:[
        {n:'DB incline press',s:ns(DI.r),r:nr(DI.r),w:`${DI.wt}# each`,no:'No slingshot · left side match only · no forced reps'},
        {n:'Landmine press',s:ns(LM.r),r:nr(LM.r),w:lmineLabel(w),no:'Single arm · shoulder-friendly arc · C5 safe'},
        {n:'Seated DB shoulder press',s:ns(DS.r),r:nr(DS.r),w:`${DS.wt}# each`},
      ]},
      {l:'Accessories · 60s rest',ex:[
        {n:'Lateral raises',s:ns(LAT.r),r:nr(LAT.r),w:`${LAT.wt}# each`,no:'Controlled · no swinging'},
        {n:'Tricep dips',s:3,r:nr(DI.r),no:'Bodyweight · toes assist OK'},
        {n:'Face pulls / band pull-aparts',s:3,r:'15–20',no:'Shoulder health — non-negotiable'},
      ]},
      {l:'Optional finisher — skip if over 55 min',ex:[{n:'Push-up ladder',s:0,r:'1 set to failure'}]},
    ]},
    {day:'TUE',label:'BJJ',tag:'BJJ',tc:'#818cf8',focus:'Technique + live rolling',note:'No lifting. Show up recovered.',time:'BJJ only',secs:[
      {l:'Training',ex:[{n:'BJJ class',s:0,r:'60–90 min'},{n:'Post-rolling mobility',s:0,r:'10 min',no:'Hips · shoulders · thoracic'}]},
    ]},
    {day:'WED',label:'OFF',tag:'Rest',tc:'#475569',focus:'4am CrossFit coaching',note:'No lifting. Gentle mobility only.',time:'Rest',secs:[
      {l:'Optional · 10 min',ex:[{n:'Cervical mobility — gentle',s:0,r:'5 min'},{n:'Hip flexor stretch',s:0,r:'5 min'}]},
    ]},
    {day:'THU',label:'PULL + BJJ',tag:'Two-a-Day',tc:'#f97316',focus:'Back / Biceps · PM: BJJ',note:`AM 50 min max · Rest: ${r} deadlift · 60s else`,time:'~50 min AM',c5:1,secs:[
      {l:'Warm-up · 5 min',ex:[{n:'Row erg easy',s:0,r:'500 m'},{n:'Band pull-aparts',s:0,r:'2×15'}]},
      {l:'Primary pull',ex:[
        {n:'Band-assisted pull-ups',s:ns(TD.r),r:nr(TD.r),w:band(w),no:'Lightest combo possible · full ROM'},
        {n:'Trap bar deadlift',s:ns(TD.r),r:nr(TD.r),w:`${TD.wt}#`,no:'Top movement of the day · drive hips'},
      ]},
      {l:'Secondary pull · 60s rest',ex:[
        {n:'Barbell row',s:ns(ROW.r),r:nr(ROW.r),w:`${ROW.wt}#`,no:'Brace · pull to belly button'},

function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
function dk(w,d){return`w${w}_${d}`;}

// ── ACTIONS ───────────────────────────────────────────────────
function st(t){S.tab=t;saveState();render();}
function sw(w){S.week=w;saveState();render();}
function sd(d){S.day=d;render();}
function sw2(k,v){const d=gd(S.week,S.day);if(!d.sets)d.sets={};if(!d.sets[k])d.sets[k]={w:'',done:false};d.sets[k].w=v;saveState();}
function tgs(k,n){const d=gd(S.week,S.day);if(!d.sets)d.sets={};const sk=`${k}_s${n}`;if(!d.sets[sk])d.sets[sk]={done:false};d.sets[sk].done=!d.sets[sk].done;saveState();render();}
function mc(){gd(S.week,S.day).completed=true;saveState();render();}
function um(){gd(S.week,S.day).completed=false;saveState();render();}
function setDayNotes(v){const d=gd(S.week,S.day);d.notes=v;saveState();}
function abw(){const i=document.getElementById('bi');const v=parseFloat(i.value);if(!v||v<50||v>500)return;S.bw.push({wt:v,date:today()});saveState();render();}
function dbw(i){S.bw.splice(i,1);saveState();render();}
function apr(){const w=parseFloat(document.getElementById('pw')?.value||prf.w),r=document.getElementById('pr2')?.value||prf.r,n=document.getElementById('pn')?.value||prf.n;if(!w||w<1)return;if(!S.prs[prf.lift])S.prs[prf.lift]=[];S.prs[prf.lift].push({weight:w,reps:r,note:n,date:today(),week:S.week});S.prs[prf.lift].sort((a,b)=>a.weight-b.weight);prf.w='';prf.r='';prf.n='';saveState();render();}
function dpr(l,i){S.prs[l].splice(i,1);if(!S.prs[l].length)delete S.prs[l];saveState();render();}

function exportData(){
  // Build a readable export with all logged data
  const pr=prog(S.week);
  const export_data={
    exported:today(),
    app:'Jack Ryan 12-Week S&C',
    summary:{sessions_completed:totalSessions(),bodyweight_entries:S.bw.length,pr_lifts:Object.keys(S.prs).length},
    bodyweight:S.bw,
    prs:S.prs,
    sessions:{}
  };
  // Expand each logged session into readable format
  Object.entries(S.data).forEach(([key,val])=>{
    const mx=key.match(/w(\d+)_(\w+)/);
    if(!mx)return;
    const wk=parseInt(mx[1]),day=mx[2];
    const dayProg=prog(wk).find(d=>d.day===day);
    if(!dayProg)return;
    const session={week:wk,day,phase:gp(wk).name,completed:val.completed,notes:val.notes||'',exercises:[]};
    dayProg.secs.forEach((sec,si)=>{
      sec.ex.forEach((ex,ei)=>{
        const k=`s${si}e${ei}`;
        const logged=(val.sets||{})[k];
        const sets_done=Array.from({length:ex.s||0},(_,n)=>(val.sets||{})[`${k}_s${n}`]?.done||false).filter(Boolean).length;
        if(logged&&(logged.w||sets_done>0)){
          session.exercises.push({
            name:ex.n,
            target_sets:ex.s||0,
            target_reps:ex.r,
            target_weight:ex.w||'',
            logged:logged.w||'',
            sets_checked:`${sets_done}/${ex.s||0}`
          });
        }
      });
    });
    export_data.sessions[key]=session;
  });
  const json=JSON.stringify(export_data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`jack-ryan-sc-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      // Support both full export format and raw state format
      if(parsed.sessions&&parsed.bodyweight!==undefined&&parsed.prs!==undefined){
        // It's a full export — we need to rebuild the raw state from it
        // Just restore the core state fields that were saved
        const raw=localStorage.getItem(STORE_KEY);
        if(raw){
          const existing=JSON.parse(raw);
          // Merge: keep existing week/day/tab preferences, restore data/bw/prs
          existing.bw=parsed.bodyweight||existing.bw;
          existing.prs=parsed.prs||existing.prs;
          S={...S,...existing};
        }
        // Also try restoring session notes from export
        Object.entries(parsed.sessions||{}).forEach(([key,sess])=>{
          if(!S.data[key])S.data[key]={sets:{},notes:'',completed:false};
          S.data[key].notes=sess.notes||S.data[key].notes;
          S.data[key].completed=sess.completed||S.data[key].completed;
        });
      } else if(parsed.data!==undefined){
        // It's a raw state backup
        S={...S,...parsed};
      }
      if(!S.prs)S.prs={};if(!S.bw)S.bw=[];if(!S.data)S.data={};
      saveState();render();
      alert('Import successful ✓');
    }catch(err){alert('Import failed — file may be corrupted or wrong format.');}
  };
  reader.readAsText(file);
}
// ── INIT ──────────────────────────────────────────────────────
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
loadState();
render();
</script>
